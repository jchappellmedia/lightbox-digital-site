name: fetch-vimeo-thumb
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch thumbnail and metadata from Vimeo
        run: |
          set -euo pipefail
          J=$(curl -sf "https://vimeo.com/api/oembed.json?url=https%3A%2F%2Fvimeo.com%2F1220703634%2F1500ae4e40")
          echo "$J" > assets/thumbs/1220703634.oembed.json
          URL=$(echo "$J" | jq -r '.thumbnail_url' | sed -E 's/_[0-9]+x[0-9]+.*$//')
          curl -sfL "${URL}_1280x720" -o assets/thumbs/1220703634.jpg \
            || curl -sfL "$URL" -o assets/thumbs/1220703634.jpg
          file assets/thumbs/1220703634.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs/1220703634.jpg assets/thumbs/1220703634.oembed.json
          git commit -m "Fetch real Vimeo thumbnail for High Plains Provisions"
          git push
